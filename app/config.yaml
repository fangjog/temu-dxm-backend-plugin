  package_type: 软包装+软物
  default_color: 白色
  fallback_color: 其他色
  default_material: 其他
  default_flower_type: 无印花
publish:
  allow_publish: true
  click_immediate_publish: true
  verify_status_after_publish: true
  wait_after_publish_seconds: 10
